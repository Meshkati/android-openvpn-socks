name: Release

# Push a tag vMAJOR.MINOR.PATCH on main to publish a GitHub Release with the
# signed APK. A pull request that changes this file builds and signs the APK
# the same way but publishes nothing, so signing is checked before a tag.
on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['.github/workflows/release.yml']

permissions:
  contents: write

jobs:
  release:
    name: Signed APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # vMAJOR.MINOR.PATCH -> versionName MAJOR.MINOR.PATCH and
      # versionCode MAJOR*10000 + MINOR*100 + PATCH, so every release upgrades
      # the previous one.
      - name: Version from tag
        id: version
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            num='(0|[1-9][0-9]?)'
            if [[ ! "$GITHUB_REF_NAME" =~ ^v$num\.$num\.$num$ ]]; then
              echo "::error::Tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH (each 0-99)"
              exit 1
            fi
            name=${GITHUB_REF_NAME#v}
            code=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          else
            name=0.0.0-pr$PR_NUMBER
            code=1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "versionName $name, versionCode $code"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: actions/setup-go@v7
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      # Same SDK setup and engine.aar cache key as ci.yml, so a tag on main
      # reuses the engine.aar that main's CI run already built.
      - name: Install Android SDK packages
        id: sdk
        run: |
          ndk=$(sed -n 's/^ndkVersion=//p' gradle.properties)
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          (yes || true) | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" "platforms;android-36" "cmake;3.22.1" "ndk;$ndk" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ndk" >> "$GITHUB_ENV"
          echo "ndk=$ndk" >> "$GITHUB_OUTPUT"

      - name: Restore engine.aar
        id: engine-cache
        uses: actions/cache@v6
        with:
          path: |
            app/libs/engine.aar
            app/libs/engine-sources.jar
          key: engine-aar-ndk${{ steps.sdk.outputs.ndk }}-${{ hashFiles('engine/**', 'scripts/build-engine.sh') }}

      - name: Build engine.aar
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: scripts/build-engine.sh

      - name: Unit tests
        run: ./gradlew :app:testReleaseUnitTest

      # Checks the secrets against the keystore before the build, with errors
      # that say which one is wrong: Gradle's own error masks the alias.
      - name: Decode and check keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::The KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          if ! listing=$(keytool -list -v -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD"); then
            echo "::error::Cannot open the keystore: check KEYSTORE_BASE64 and KEYSTORE_PASSWORD"
            exit 1
          fi
          aliases=$(sed -n 's/^Alias name: //p' <<< "$listing")
          if ! grep -qixF -- "$KEY_ALIAS" <<< "$aliases"; then
            echo "::error::KEY_ALIAS (${#KEY_ALIAS} characters) is not a key in the keystore, which has: $(paste -sd, - <<< "$aliases")"
            exit 1
          fi

      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >-
          ./gradlew :app:assembleRelease
          -PversionName=${{ steps.version.outputs.name }}
          -PversionCode=${{ steps.version.outputs.code }}

      - name: Verify signature and checksum
        id: apk
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          build_tools=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$build_tools/apksigner" verify --print-certs "$apk"
          mkdir dist
          out=ovpnvless-${{ steps.version.outputs.name }}.apk
          cp "$apk" "dist/$out"
          (cd dist && sha256sum "$out" > SHA256SUMS && cat SHA256SUMS)

      - name: Upload APK (pull request)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: release-check-${{ steps.version.outputs.name }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --verify-tag
          --title "$GITHUB_REF_NAME"
          --generate-notes
